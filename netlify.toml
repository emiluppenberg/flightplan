[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/reports/taf"
  to = "https://aviationweather.gov/api/data/taf"
  status = 200
  force = true

  [redirects.headers]
    "User-Agent" = "FlyRep/0.1"

[[redirects]]
  from = "/api/reports/metar"
  to = "https://aviationweather.gov/api/data/metar"
  status = 200
  force = true

  [redirects.headers]
    "User-Agent" = "FlyRep/0.1"

[[redirects]]
  from = "/api/airports"
  to = "https://airportsapi.com/api/airports"
  status = 200
  force = true

  [redirects.headers]
    "User-Agent" = "FlyRep/0.1"

[[redirects]]
  from = "/api/airports/*"
  to = "https://airportsapi.com/api/airports/:splat"
  status = 200
  force = true

  [redirects.headers]
    "User-Agent" = "FlyRep/0.1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  framework = "#custom"
  command = "vite"
  targetPort = 5173
  port = 8888

  [dev.https]
    certFile = "certs/localhost.pem"
    keyFile = "certs/localhost-key.pem"
