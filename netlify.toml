[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/data/*"
  to = "https://aviationweather.gov/api/data/:splat"
  status = 200
  force = true

  [redirects.headers]
    "User-Agent" = "flightplan/0.1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
