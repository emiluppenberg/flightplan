[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/aviationweather/*"
  to = "https://aviationweather.gov/api/data/:splat"
  status = 200
  force = true

  [redirects.headers]
    "User-Agent" = "flightplan/0.1"

[[redirects]]
  from = "/api/*"
  to = "http://localhost:3000/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

